<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
  <title id="title">Cyber Snake Arcade</title>
  <desc id="desc">A neon cyberpunk snake moving through a developer contribution matrix.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070A12"/><stop offset="1" stop-color="#10152A"/>
    </linearGradient>
    <linearGradient id="snake" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/><stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="30" height="24" patternUnits="userSpaceOnUse">
      <rect x="1" y="1" width="4" height="4" rx="1" fill="#26304A" opacity=".7"/>
    </pattern>
    <style>
      .scan { animation: scan 4s linear infinite; }
      .pulse { animation: pulse 1.5s ease-in-out infinite; }
      .blink { animation: blink 1.2s steps(2,end) infinite; }
      @keyframes scan { from { transform: translateX(-120px); } to { transform: translateX(1020px); } }
      @keyframes pulse { 0%,100% { opacity:.35; } 50% { opacity:1; } }
      @keyframes blink { 50% { opacity:.25; } }
    </style>
  </defs>

  <rect width="900" height="260" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="258" rx="17" fill="none" stroke="#293451"/>
  <rect x="24" y="58" width="852" height="160" rx="10" fill="url(#grid)"/>

  <g font-family="monospace" fill="#8B9BBF">
    <text x="28" y="30" font-size="12">KARTIKAY@GITHUB :: CYBER_SNAKE.EXE</text>
    <text x="28" y="47" font-size="9" fill="#52617E">SYSTEM ONLINE  //  TARGET: CONTRIBUTION MATRIX  //  MODE: NIGHT</text>
    <text x="810" y="30" font-size="10" fill="#00E5FF">[ LIVE ]</text>
  </g>

  <!-- scanning beam -->
  <rect class="scan" x="0" y="58" width="80" height="160" fill="#00E5FF" opacity=".035"/>

  <!-- collectible nodes -->
  <g filter="url(#glow)" fill="#F59E0B">
    <circle class="pulse" cx="150" cy="92" r="3"/><circle class="pulse" cx="360" cy="188" r="3"/>
    <circle class="pulse" cx="570" cy="116" r="3"/><circle class="pulse" cx="780" cy="188" r="3"/>
  </g>

  <!-- neon snake path -->
  <path d="M55 80 H235 V128 H125 V176 H330 V104 H510 V200 H705 V152 H845" fill="none" stroke="#0B1020" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M55 80 H235 V128 H125 V176 H330 V104 H510 V200 H705 V152 H845" fill="none" stroke="url(#snake)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="22 14" opacity=".35">
    <animate attributeName="stroke-dashoffset" from="0" to="-72" dur="1.4s" repeatCount="indefinite"/>
  </path>

  <!-- animated head -->
  <g filter="url(#glow)">
    <circle r="10" fill="#00E5FF">
      <animateMotion dur="8s" repeatCount="indefinite" rotate="auto" path="M55 80 H235 V128 H125 V176 H330 V104 H510 V200 H705 V152 H845"/>
    </circle>
    <circle r="4" fill="#FFFFFF">
      <animateMotion dur="8s" repeatCount="indefinite" rotate="auto" path="M55 80 H235 V128 H125 V176 H330 V104 H510 V200 H705 V152 H845"/>
    </circle>
  </g>

  <!-- eyes / HUD -->
  <g class="blink" font-family="monospace" font-size="9">
    <text x="38" y="242" fill="#52617E">SCORE  //  ∞</text>
    <text x="400" y="242" fill="#52617E">COLLECT • COMMIT • SHIP</text>
    <text x="770" y="242" fill="#00E5FF">v2.0</text>
  </g>
</svg>
